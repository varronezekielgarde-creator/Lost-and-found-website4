<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost & Found | Student Portal</title>
<style>
:root{--deep:#435b43;--green:#829b70;--sage:#a9bd91;--pale:#eef2e7;--cream:#f8f8f1;--ink:#354235;--muted:#71806d;--line:#dce4d3}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5}header{background:var(--deep);color:white;padding:17px 6%;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:1.2rem;font-weight:800}.brand span{color:#d7e4c6}main{width:min(1000px,92%);margin:30px auto 55px}.screen{display:none}.screen.active{display:block}.welcome,.card{background:white;border:1px solid var(--line);border-radius:18px;padding:25px;margin:18px 0;box-shadow:0 10px 26px #435b4310}.welcome{text-align:center;padding:45px 20px;background:linear-gradient(135deg,#e8efdd,#fff)}h1,h2,h3{color:var(--deep)}h1{font-size:clamp(1.8rem,5vw,2.7rem);margin:0}h2{margin-top:0}p{color:var(--muted)}button{border:0;border-radius:9px;padding:12px 17px;background:var(--green);color:white;font-weight:bold;cursor:pointer;font-size:.95rem}button:hover{filter:brightness(.94)}button.secondary{background:#e8eddf;color:var(--deep)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.center{justify-content:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-top:18px}.choice{text-align:left;background:white;color:var(--deep);border:1px solid var(--line);padding:22px;border-radius:14px}.choice strong,.choice span{display:block}.choice span{font-weight:normal;color:var(--muted);margin-top:5px}form{display:grid;gap:13px}label{display:grid;gap:6px;color:var(--deep);font-weight:bold}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit}textarea{min-height:90px}.notice{padding:13px;background:var(--pale);border-left:4px solid var(--green);border-radius:7px;color:var(--deep)}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.item{border:1px solid var(--line);border-radius:12px;padding:15px;background:white}.item h3{margin:7px 0}.item p{margin:5px 0}.status{display:inline-block;background:var(--pale);color:var(--deep);border-radius:20px;padding:3px 9px;font-size:.8rem;font-weight:bold}.empty{padding:22px;text-align:center;border:1px dashed var(--sage);border-radius:10px;color:var(--muted)}footer{text-align:center;color:var(--muted);padding:20px;font-size:.85rem}a{color:var(--deep)}@media(max-width:600px){.card{padding:18px}.welcome{padding:32px 17px}}
</style></head>
<body>
<header><div class="brand">LOST <span>&</span> FOUND</div><div>Student Lost Item Assistance Portal</div></header>
<main>
<section id="home" class="screen active"><div class="welcome"><h1>Lost something? Found something?</h1><p>Report lost belongings and help return items to their owners.</p><div class="actions center"><button onclick="go('login')">Get Started / Log In</button><button class="secondary" onclick="go('register')">Create Account</button></div></div></section>
<section id="login" class="screen"><div class="card"><h2>Log In</h2><form onsubmit="event.preventDefault();go('dashboard');logActivity('User logged in','Login')"><label>Email or Student ID<input required></label><label>Password<input type="password" required></label><button>Log In</button></form><p class="notice">Demo login: enter any email/student ID and password.</p><button class="secondary" onclick="go('home')">Back</button></div></section>
<section id="register" class="screen"><div class="card"><h2>Create Account</h2><form onsubmit="event.preventDefault();logActivity('New demo account registered','Registration');alert('Demo registration complete.');go('login')"><label>Full name<input required></label><label>Student ID<input required></label><label>Email<input type="email" required></label><label>Password<input type="password" required></label><button>Register</button></form><button class="secondary" onclick="go('login')">Back to Log In</button></div></section>
<section id="dashboard" class="screen"><div class="topline"><div><h1>User Dashboard</h1><p>Choose what you want to do.</p></div><button class="secondary" onclick="go('home')">Log Out</button></div><div class="grid"><button class="choice" onclick="go('reportChoice')"><strong>＋ Report an Item</strong><span>Submit a lost or found item report.</span></button><button class="choice" onclick="go('browse')"><strong>⌕ Browse / Search Items</strong><span>Search and filter verified reports.</span></button></div></section>
<section id="reportChoice" class="screen"><div class="card"><h2>Choose Report Type</h2><div class="grid"><button class="choice" onclick="openReport('Lost')"><strong>Lost Item</strong><span>I lost something.</span></button><button class="choice" onclick="openReport('Found')"><strong>Found Item</strong><span>I found
